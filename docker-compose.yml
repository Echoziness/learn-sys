services:
  db-init:
    build:
      context: .
      network: host # 构建容器共享宿主网络：127.0.0.1 代理可达（~/.docker/config.json 注入代理 env）
      args:
        # ghcr.io 不可达时经 .env 覆盖：UV_IMAGE=ghcr.m.daocloud.io/astral-sh/uv:latest
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:latest}
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      HF_HUB_OFFLINE: "1" # 模型随 data/ 卷挂载，禁止容器内联网探测
      # runtime 清空代理（config.json 的 proxies 注入指向容器内不存在的
      # 127.0.0.1:7897 → refused）；LLM 走直连（api.deepseek.com 国内可达）
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    command: ["uv", "run", "--no-dev", "python", "scripts/init_db.py"]

  api:
    build:
      context: .
      network: host
      args:
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:latest}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file: .env
    environment:
      HF_HUB_OFFLINE: "1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s # BGE-M3 加载约 30-60s
    command: ["uv", "run", "--no-dev", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    build:
      context: ./web
      network: host
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000 # build 时内联（运行时 env 无效）
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
